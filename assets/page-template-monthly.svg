<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100">
  <defs>
    <style>
      .label{font-family:Montserrat, sans-serif; font-size:14px; fill:#6B3A3F}
      .heading{font-family:'Cormorant Garamond', serif; font-size:22px; fill:#6B3A3F}
      .box{fill:none;stroke:#E9E2DF;stroke-width:2; rx:6}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFF7EE"/>
  <text x="60" y="80" class="heading">Monthly Overview</text>
  <!-- simple grid for month days (5 rows x 7 cols) -->
  <g transform="translate(60,110)" stroke="#E9E2DF" fill="none">
    <!-- rows -->
    <rect x="0" y="0" width="730" height="720" rx="8"/>
    <!-- vertical & horizontal lines -->
    <!-- columns -->
    <g stroke="#E9E2DF">
      <line x1="104" y1="0" x2="104" y2="720"/>
      <line x1="208" y1="0" x2="208" y2="720"/>
      <line x1="312" y1="0" x2="312" y2="720"/>
      <line x1="416" y1="0" x2="416" y2="720"/>
      <line x1="520" y1="0" x2="520" y2="720"/>
      <line x1="624" y1="0" x2="624" y2="720"/>
    </g>
    <g stroke="#E9E2DF">
      <line x1="0" y1="144" x2="730" y2="144"/>
      <line x1="0" y1="288" x2="730" y2="288"/>
      <line x1="0" y1="432" x2="730" y2="432"/>
      <line x1="0" y1="576" x2="730" y2="576"/>
    </g>
  </g>
</svg>
