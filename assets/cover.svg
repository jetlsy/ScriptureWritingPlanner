<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850">
  <defs>
    <style>
      .title{font-family:'Cormorant Garamond', serif; font-size:44px; fill:#6B3A3F}
      .subtitle{font-family:'Cormorant Garamond', serif; font-size:18px; fill:#6B3A3F}
      .credit{font-family:Montserrat, sans-serif; font-size:14px; fill:#6B3A3F}
      .swatch{stroke:#e9e2df; stroke-width:1}
    </style>
  </defs>
  <!-- background -->
  <rect width="100%" height="100%" fill="#FFF7EE"/>
  <!-- soft organic shapes -->
  <ellipse cx="180" cy="120" rx="140" ry="70" fill="#F8CBB3" opacity="0.95"/>
  <ellipse cx="920" cy="740" rx="140" ry="90" fill="#F6D0D6" opacity="0.9"/>
  <!-- delicate line-art flower (simplified) -->
  <g transform="translate(820,120) scale(0.9)" stroke="#C99AA2" fill="none" stroke-width="2">
    <path d="M0,0 C8,-12 28,-12 36,0 C44,12 28,36 0,36 C-28,36 -44,12 -36,0 C-28,-12 -8,-12 0,0 Z"/>
    <circle cx="0" cy="10" r="4" fill="#D6B36A" stroke="none"/>
  </g>
  <!-- Title -->
  <text x="80" y="260" class="title">Scripture Writing Planner</text>
  <!-- Subtitle (Option A) -->
  <text x="80" y="300" class="subtitle">A gentle guided space for scripture, prayer, and reflection</text>
  <!-- Credit / line -->
  <text x="80" y="340" class="credit">Write. Reflect. Grow.</text>
  <!-- decorative sparkle -->
  <g transform="translate(980,40)" fill="#D6B36A" opacity="0.9">
    <circle cx="0" cy="0" r="3"/>
    <rect x="-1" y="8" width="2" height="8" rx="1"/>
  </g>
  <!-- bottom ribbon -->
  <rect x="60" y="560" width="980" height="190" rx="14" fill="#FFF7EE" stroke="#F6D0D6"/>
</svg>
