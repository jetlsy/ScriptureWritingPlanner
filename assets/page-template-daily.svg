<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100">
  <defs>
    <style>
      .label{font-family:Montserrat, sans-serif; font-size:14px; fill:#6B3A3F}
      .heading{font-family:'Cormorant Garamond', serif; font-size:22px; fill:#6B3A3F}
      .box{fill:none;stroke:#E9E2DF;stroke-width:2; rx:8}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFF7EE"/>
  <!-- header -->
  <text x="60" y="80" class="heading">Daily Planner</text>
  <!-- top boxes -->
  <rect x="60" y="100" width="360" height="80" class="box"/>
  <text x="70" y="132" class="label">Top 3 Priorities</text>
  <rect x="460" y="100" width="280" height="80" class="box"/>
  <text x="470" y="132" class="label">Today&apos;s Focus</text>
  <!-- schedule column -->
  <rect x="60" y="200" width="220" height="720" class="box"/>
  <text x="70" y="222" class="label">Schedule</text>
  <!-- scripture & prayer -->
  <rect x="300" y="200" width="440" height="220" class="box"/>
  <text x="310" y="222" class="label">Scripture &amp; Notes</text>
  <rect x="300" y="440" width="440" height="200" class="box"/>
  <text x="310" y="462" class="label">Prayer &amp; Reflections</text>
  <!-- notes area -->
  <rect x="300" y="660" width="440" height="260" class="box"/>
  <text x="310" y="682" class="label">Notes</text>
  <!-- subtle decoration -->
  <circle cx="780" cy="1000" r="40" fill="#F8CBB3" opacity="0.6"/>
</svg>
